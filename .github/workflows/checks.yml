name: 기본 틀 확인
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: PDF 확인용 한글 글꼴 준비
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum
      - name: 코드 문법 확인
        run: python -m compileall -q main.py shared.py validation.py export_outputs.py agents
      - name: 연결·입출력·PDF 검사 (AI 호출 없음)
        run: python -m unittest discover -s tests -v
