name: 코드와 보고서 검사
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - name: 자동 검사
        run: python -m pytest -q
      - name: 전체 흐름과 PDF 생성
        run: python main.py demo --output output/ci-demo
      - name: 제출 보고서 재생성
        run: python main.py report --records examples/final/records.json --output output/ci-report
